  <!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexStoria — Log Masuk</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const NexStoriaConfig = {
  supabase: {
    url: "https://lkeehgivbuhkwdfrvexm.supabase.co",
    anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrZWVoZ2l2YnVoa3dkZnJ2ZXhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MDg3OTIsImV4cCI6MjA4ODQ4NDc5Mn0.DgNMgoRjNOJK4uh-74lrpkMqM9_fiJi2j81RxQzNx3s",
  },
};
window.NexStoriaConfig = NexStoriaConfig;
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --coral:#FF6B6B;
  --pink:#f472b6;
  --sky:#38bdf8;
  --lav:#A78BFA;
  --mint:#06D6A0;
  --sun:#FFD166;
  --ink:#1A1A2E;
  --soft:#6b6b8a;
  --border:#e8e8f0;
  --off:#f8f8ff;
}
html{height:100%}
body{
  font-family:'Nunito',sans-serif;
  min-height:100vh;
  background:var(--off);
  display:flex;
  overflow-x:hidden;
}

.left-panel{
  width:42%;
  background:linear-gradient(145deg,#0f0f22,#1a1040,#0d1a30);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:3rem 2.5rem;
  position:relative;
  flex-shrink:0;
}
.lp-blob{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;}
.lp-b1{width:350px;height:350px;background:rgba(255,107,107,0.12);top:-80px;left:-80px;}
.lp-b2{width:280px;height:280px;background:rgba(167,139,250,0.1);bottom:-60px;right:-60px;}
.lp-inner{position:relative;z-index:1;text-align:center;max-width:340px;width:100%;}

.lp-logo{margin-bottom:1.2rem;}
.lp-logo img{width:190px;filter:drop-shadow(0 8px 24px rgba(255,107,107,0.25));}
.lp-mascot{height:170px;margin-bottom:1.5rem;}
.lp-mascot img{height:100%;object-fit:contain;animation:floatChar 4s ease-in-out infinite;}
@keyframes floatChar{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.login-card{
  background:rgba(255,255,255,0.05);
  border:1.5px solid rgba(255,255,255,0.08);
  border-radius:20px;
  padding:1.6rem 1.8rem;
  backdrop-filter:blur(10px);
  text-align:left;
  width:100%;
}
.login-title{
  font-family:'Baloo 2',cursive;
  font-size:1.15rem;font-weight:900;
  color:#fff;
  margin-bottom:1.1rem;
  text-align:center;
}
.field-group{margin-bottom:0.85rem;}
.field-row{
  display:flex;align-items:center;
  background:rgba(255,255,255,0.07);
  border:1.5px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:0 14px;
}
.field-row:focus-within{
  border-color:rgba(167,139,250,0.5);
  background:rgba(255,255,255,0.1);
}
.field-icon{font-size:0.9rem;margin-right:9px;opacity:0.6;}
.field-input{
  flex:1;padding:11px 0;
  background:transparent;border:none;outline:none;
  font-family:'Nunito',sans-serif;font-size:0.88rem;font-weight:600;
  color:#fff;
}
.field-input::placeholder{color:rgba(255,255,255,0.3);}
.pw-toggle{
  background:none;border:none;cursor:pointer;
  font-size:0.9rem;color:rgba(255,255,255,0.3);
}
.forgot-link{
  display:block;text-align:right;
  font-size:0.72rem;font-weight:700;
  color:rgba(255,255,255,0.4);
  text-decoration:none;
  margin-top:5px;margin-bottom:1rem;
}
.forgot-link:hover{color:var(--lav);}

.btn-login{
  width:100%;
  font-family:'Baloo 2',cursive;font-weight:800;font-size:1rem;
  padding:13px;border-radius:12px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#2563eb,#38bdf8);
  color:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:0.8rem;
}
.btn-login:disabled{opacity:0.6;cursor:not-allowed;}

.btn-google{
  width:100%;
  background:white;
  border:1.5px solid #e2e8f0;
  border-radius:12px;
  padding:12px;
  font-family:'Nunito',sans-serif;
  font-weight:700;
  font-size:0.9rem;
  color:#1e293b;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  transition:all 0.2s;
}
.btn-google:hover{
  background:#f8fafc;
  border-color:#cbd5e1;
  transform:translateY(-1px);
}
.divider{
  display:flex;
  align-items:center;
  text-align:center;
  margin:1rem 0;
  color:#94a3b8;
  font-size:0.75rem;
  font-weight:600;
}
.divider::before,.divider::after{
  content:'';
  flex:1;
  border-bottom:1px solid rgba(255,255,255,0.2);
}
.divider span{margin:0 10px;}

.btn-spinner{
  display:none;width:16px;height:16px;
  border:2px solid rgba(0,0,0,0.2);border-top-color:#2563eb;
  border-radius:50%;animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.auth-msg{
  padding:9px 13px;border-radius:10px;
  font-size:0.76rem;font-weight:700;
  margin-bottom:0.9rem;display:none;
}
.auth-msg.error{background:rgba(255,107,107,0.12);border:1.5px solid rgba(255,107,107,0.25);color:#fca5a5;}
.auth-msg.success{background:rgba(6,214,160,0.12);border:1.5px solid rgba(6,214,160,0.25);color:#6ee7b7;}

.signup-link{
  text-align:center;margin-top:1rem;
  font-size:0.76rem;font-weight:700;
  color:rgba(255,255,255,0.35);
}
.signup-link a{color:var(--sun);text-decoration:none;font-weight:800;}

.right-panel{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  padding:2.5rem 2rem;
  background:#fff;
}
.rp-inner{width:100%;max-width:500px;}
.rp-heading{text-align:center;margin-bottom:2rem;}
.rp-title{
  font-family:'Baloo 2',cursive;
  font-size:1.25rem;font-weight:900;
  color:var(--ink);
}
.role-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1rem;
  margin-bottom:2rem;
}
.role-card{
  border:2.5px solid var(--border);
  border-radius:18px;
  padding:1.3rem 0.8rem 1.1rem;
  text-align:center;
  cursor:pointer;
  transition:all 0.3s;
  background:var(--off);
}
.role-card.selected.rc-reader{border-color:var(--sky);background:rgba(56,189,248,0.05);}
.role-card.selected.rc-writer{border-color:var(--coral);background:rgba(255,107,107,0.05);}
.role-card.selected.rc-hybrid{border-color:var(--mint);background:rgba(6,214,160,0.05);}
.rc-mascot{
  width:80px;height:80px;
  margin:0 auto 0.7rem;
  border-radius:50%;
  border:3px solid var(--border);
  background:var(--off);
}
.rc-mascot img{width:100%;height:100%;object-fit:cover;}
.rc-name{
  font-family:'Baloo 2',cursive;
  font-size:0.95rem;font-weight:900;
}
.rc-desc{font-size:0.68rem;color:var(--soft);font-weight:700;margin-top:4px;}
.rc-selected-ring{display:none;}
.role-card.selected .rc-selected-ring{
  display:block;
  position:absolute;top:8px;right:8px;
  width:18px;height:18px;border-radius:50%;
  background:var(--sky);color:#fff;
  text-align:center;font-size:0.65rem;
}
.btn-daftar{
  width:100%;
  font-family:'Baloo 2',cursive;font-weight:900;font-size:1.05rem;
  padding:14px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#f59e0b,var(--sun));
  color:#1a0a00;
}
.success-overlay{
  position:fixed;inset:0;
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(10px);
  z-index:300;display:none;
  align-items:center;justify-content:center;
  flex-direction:column;text-align:center;
}
.success-overlay.show{display:flex;}
.so-icon{font-size:3.5rem;margin-bottom:1rem;}
.so-title{font-family:'Baloo 2',cursive;font-size:1.6rem;font-weight:900;color:var(--ink);}
.so-sub{font-size:0.85rem;color:var(--soft);font-weight:600;margin-top:0.5rem;}
@media(max-width:768px){
  body{flex-direction:column;}
  .left-panel{width:100%;padding:2rem 1.5rem;}
  .lp-mascot{height:120px;}
  .right-panel{padding:1.5rem 1rem;}
  .role-grid{gap:0.6rem;}
  .rc-mascot{width:60px;height:60px;}
}
</style>
</head>
<body>

<div class="left-panel">
  <div class="lp-blob lp-b1"></div>
  <div class="lp-blob lp-b2"></div>
  <div class="lp-inner">
    <div class="lp-logo">
      <img src="https://res.cloudinary.com/dotejpjfv/image/upload/v1775572491/ofygtko3ww5yaet6gtuf.png" alt="NexStoria Logo">
    </div>
    <div class="lp-mascot">
      <img src="https://res.cloudinary.com/dotejpjfv/image/upload/v1775410097/psclkmxd7fvybrjpzl21.png" alt="Maskot">
    </div>
    <div class="login-card">
      <div class="login-title">✨ Log Masuk ke NexStoria</div>
      <div class="auth-msg" id="auth-msg"></div>
      
      <!-- BUTANG GOOGLE -->
      <button class="btn-google" onclick="signInWithGoogle()" id="btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Log Masuk dengan Google</span>
      </button>
      
      <div class="divider"><span>atau dengan emel</span></div>
      
      <div class="field-group">
        <div class="field-row">
          <span class="field-icon">✉️</span>
          <input class="field-input" type="email" id="email" placeholder="Emel">
        </div>
      </div>
      <div class="field-group">
        <div class="field-row">
          <span class="field-icon">🔒</span>
          <input class="field-input" type="password" id="password" placeholder="Kata Laluan">
          <button class="pw-toggle" onclick="togglePw()" type="button">👁️</button>
        </div>
      </div>
      <a href="#" class="forgot-link" onclick="showForgot(event)">🔑 Lupa Kata Laluan?</a>
      <button class="btn-login" onclick="doLogin()" id="btn-login">
        <span>✅ Log Masuk</span>
        <div class="btn-spinner" id="btn-spin"></div>
      </button>
      <div class="signup-link">Belum ada akaun? <a href="nexstoria-daftar.html">Daftar Sekarang &rsaquo;</a></div>
    </div>
  </div>
</div>

<div class="right-panel">
  <div class="rp-inner">
    <div class="rp-heading"><span class="rp-title">Pilih Peranan Anda:</span></div>
    <div class="role-grid">
      <div class="role-card rc-reader" onclick="selectRole('reader', this)">
        <div class="rc-selected-ring">✓</div>
        <div class="rc-mascot"><img src="https://res.cloudinary.com/dotejpjfv/image/upload/v1775625944/uqw6x4fbqcdx9uvpstw1.png" alt="Reader"></div>
        <div class="rc-name">NexReader</div>
        <div class="rc-desc">Membaca Cerita</div>
      </div>
      <div class="role-card rc-writer" onclick="selectRole('writer', this)">
        <div class="rc-selected-ring">✓</div>
        <div class="rc-mascot"><img src="https://res.cloudinary.com/dotejpjfv/image/upload/v1775625943/fxg3cglk7ebalt7zfnnm.png" alt="Writer"></div>
        <div class="rc-name">NexWriter</div>
        <div class="rc-desc">Menulis Karya</div>
      </div>
      <div class="role-card rc-hybrid" onclick="selectRole('hybrid', this)">
        <div class="rc-selected-ring">✓</div>
        <div class="rc-mascot"><img src="https://res.cloudinary.com/dotejpjfv/image/upload/v1776156328/qry2xzdfznfun1gs5ufv.png" alt="Hybrid"></div>
        <div class="rc-name">NexHybrid</div>
        <div class="rc-desc">Baca & Tulis</div>
      </div>
    </div>
    <button class="btn-daftar" onclick="goDaftar()">✉️ Daftar Sekarang</button>
  </div>
</div>

<div class="success-overlay" id="success-overlay">
  <div class="so-icon" id="so-icon">📖</div>
  <div class="so-title" id="so-title">Selamat Datang!</div>
  <div class="so-sub" id="so-sub">Log masuk berjaya. Mengarahkan kamu...</div>
</div>

<script>
const SUPABASE_URL = NexStoriaConfig.supabase.url;
const SUPABASE_ANON = NexStoriaConfig.supabase.anonKey;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let selectedRole = null;

function selectRole(role, el) {
  selectedRole = role;
  document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

function goDaftar() {
  window.location.href = selectedRole ? `nexstoria-daftar.html?role=${selectedRole}` : 'nexstoria-daftar.html';
}

function togglePw() {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function showMsg(msg, type) {
  const el = document.getElementById('auth-msg');
  el.textContent = msg;
  el.className = `auth-msg ${type}`;
  el.style.display = 'block';
}

// GOOGLE SIGN IN
async function signInWithGoogle() {
  const btn = document.getElementById('btn-google');
  btn.disabled = true;
  btn.innerHTML = '<div class="btn-spinner" style="display:block;margin:0 auto;"></div>';
  
  try {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/nexstoria-login.html',
      }
    });
    if (error) throw error;
  } catch (err) {
    btn.disabled = false;
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Log Masuk dengan Google';
    showMsg('❌ Gagal: ' + err.message, 'error');
  }
}

// Handle Google callback
async function handleGoogleCallback() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const user = session.user;
    const name = user.user_metadata?.full_name || user.email.split('@')[0];
    const icon = '🔐';
    document.getElementById('so-icon').textContent = icon;
    document.getElementById('so-title').textContent = `Selamat Datang, ${name}!`;
    document.getElementById('so-sub').textContent = `Login Google berjaya. Mengarahkan ke profil...`;
    document.getElementById('success-overlay').classList.add('show');
    setTimeout(() => { window.location.href = 'nexstoria_profile.html'; }, 2000);
  }
}

// Email login
async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { showMsg('Sila masukkan emel & kata laluan.', 'error'); return; }
  
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  document.getElementById('btn-spin').style.display = 'block';
  
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    const { data: { session } } = await sb.auth.getSession();
    const user = session.user;
    const name = user.user_metadata?.full_name || email.split('@')[0];
    document.getElementById('so-icon').textContent = '📖';
    document.getElementById('so-title').textContent = `Selamat Datang, ${name}!`;
    document.getElementById('so-sub').textContent = `Log masuk berjaya. Mengarahkan kamu...`;
    document.getElementById('success-overlay').classList.add('show');
    setTimeout(() => { window.location.href = 'nexstoria_profile.html'; }, 2000);
  } catch (err) {
    showMsg('❌ ' + (err.message.includes('Invalid login') ? 'E-mel atau kata laluan salah.' : err.message), 'error');
  } finally {
    btn.disabled = false;
    document.getElementById('btn-spin').style.display = 'none';
  }
}

async function showForgot(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) { showMsg('Sila masukkan emel anda.', 'error'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/nexstoria-login.html' });
  if (error) showMsg('❌ ' + error.message, 'error');
  else showMsg('📧 E-mel reset telah dihantar!', 'success');
}

document.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
window.addEventListener('DOMContentLoaded', () => { handleGoogleCallback(); });
document.getElementById('card-reader')?.click();
</script>
</body>
